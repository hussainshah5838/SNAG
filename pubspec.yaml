name: snag
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.7.0

dependencies:
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  cached_network_image: ^3.4.1
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.8
  dotted_border: ^3.1.0
  dropdown_button2: ^2.3.9
  expandable: ^5.0.1
  flutter:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.11
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.17
  flutter_xlider: ^3.5.0
  get: ^4.7.1
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.10.0
  google_places_flutter: ^2.0.9
  intl: null
  pinput: ^5.0.1
  sheet: ^1.0.0
  smooth_page_indicator: ^1.2.0+3
  socket_io_client: ^2.0.3+1
  syncfusion_flutter_charts: ^31.1.17

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/work_sans/WorkSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/work_sans/WorkSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/work_sans/WorkSans-Light.ttf
          weight: 300
        - asset: assets/fonts/work_sans/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/work_sans/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/work_sans/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/work_sans/WorkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/work_sans/WorkSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/work_sans/WorkSans-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/images/
  output_path: lib/constants/
  filename: app_images.dart
  field_prefix: ''
